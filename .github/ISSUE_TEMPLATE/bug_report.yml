name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste prompts, answers, tokens or any credential.**
        `ai-orchestra doctor` output is safe to share: it sends no prompt and contains no secrets.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command, or the page and clicks in the web interface.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ai-orchestra doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, Web interface, Agent Theater, Research / fetcher, Memory, MCP server, Providers (Claude / Codex / Antigravity), Docs, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI Orchestra version
      description: "`ai-orchestra --version`, or the commit if you built from source."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 14 / Ubuntu 24.04 / ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs (`-vv`, with secrets removed), screenshots, whether it always happens.
