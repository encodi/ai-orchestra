<html><head><title>Garden notes</title></head><body><main>
<p>Tomatoes need regular watering and plenty of sun during the summer months. Compost improves the soil structure over the season and reduces the need for fertilizer.</p>
<p>Prune the lower leaves to improve airflow and avoid splashing water on the plants when you irrigate in the evening.</p>
</main></body></html>
